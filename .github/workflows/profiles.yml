name: Release

# Builds our patched Grout and publishes it as grout-mosaic-patch-<ver>.<n>.zip,
# which users extract over stock Grout <ver>. <n> is our own revision for that
# Grout version, starting at 0. Upstream's workflows are disabled on
# this fork; this file has its own name so rebasing never conflicts with them.
#
#   push to a branch other than main  -> test
#   push a grout-mosaic-patch-v* tag  -> test, build, package, publish pre-release
#   workflow_dispatch                 -> the same for a given tag; dry_run
#                                        (the default) skips publishing
#
# Besides the binaries, the zip carries Grout's MIT LICENSE, as stock does, and
# the licenses of the third-party modules linked into the binaries.

on:
  push:
    branches-ignore: [main]
    tags: ['grout-mosaic-patch-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. grout-mosaic-patch-v5.3.1.4.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and upload the workflow artifact only; do not touch the release'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  # As in upstream's CI: ignore any go.work and build against the gabagool
  # version pinned in go.mod.
  GOWORK: "off"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-ttf-dev libsdl2-gfx-dev libsdl2-image-dev

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  version:
    name: Resolve version
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive version and check it against pak.json
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # grout-mosaic-patch-v5.3.1.4.0 is revision 0 for Grout v5.3.1.4.
          if ! echo "$TAG" | grep -Eq '^grout-mosaic-patch-v[0-9]+(\.[0-9]+)*\.[0-9]+$'; then
            echo "::error::Tag '$TAG' is not grout-mosaic-patch-v<Grout version>.<revision>"
            exit 1
          fi
          RELEASE="${TAG#grout-mosaic-patch-}"
          VERSION="${RELEASE%.*}"
          PAK=$(jq -r .version pak.json)
          # The zip only replaces the binaries, so they have to match the stock
          # launch.sh and libraries of the same Grout version.
          if [ "$VERSION" != "$PAK" ]; then
            echo "::error::Tag version '$VERSION' does not match pak.json version '$PAK'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: arm64
            platform: linux/arm64
            dockerfile: docker/Dockerfile
          - name: arm32
            platform: linux/arm/v7
            dockerfile: docker/32.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # arm/v7 images run under emulation on the arm64 runner, as in upstream.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        env:
          GROUT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx build --load \
            --platform=${{ matrix.platform }} \
            --build-arg GITHUB_ACTIONS=false \
            --build-arg GROUT_VERSION="$GROUT_VERSION" \
            -t grout-mosaic-patch:${{ matrix.name }} \
            -f ${{ matrix.dockerfile }} .

      - name: Extract binary
        run: |
          mkdir -p out
          ctr=$(docker create --platform=${{ matrix.platform }} grout-mosaic-patch:${{ matrix.name }})
          docker cp "$ctr:/build/grout" "out/grout-${{ matrix.name }}"
          docker rm "$ctr"
          file "out/grout-${{ matrix.name }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: grout-${{ matrix.name }}
          path: out/grout-${{ matrix.name }}
          if-no-files-found: error

  package:
    name: Package and release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: grout-*
          path: bin
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Grout's binaries carry these modules' code, and their licenses ask for
      # the notices to travel with it.
      - name: Third-party notices
        run: |
          set -euo pipefail
          mkdir -p notices
          out=notices/THIRD-PARTY-NOTICES.txt
          for arch in arm64 arm; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=1 go list -deps \
              -f '{{if and (not .Standard) .Module (not .Module.Main)}}{{.Module.Path}}@{{.Module.Version}} {{.Module.Dir}}{{end}}' ./app
          done | sort -u > notices/modules.txt
          {
            echo "Third-party software in Grout $VERSION (grout64 and grout32)"
            echo
            echo "Grout links the Go modules below. Each is unmodified, and its source"
            echo "is available at https://pkg.go.dev/<module>@<version>."
            printf '\n%s\n%s (LICENSE)\n%s\n\n' "$(printf '=%.0s' {1..78})" "Go runtime and standard library, $(go version bin/grout-arm64 | cut -d' ' -f2)" "$(printf '=%.0s' {1..78})"
            cat "$(go env GOROOT)/LICENSE"
            while read -r mod dir; do
              for f in $(find "$dir" -maxdepth 1 -type f \( -iname 'LICEN[CS]E*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) | sort); do
                printf '\n%s\n%s (%s)\n%s\n\n' "$(printf '=%.0s' {1..78})" "$mod" "$(basename "$f")" "$(printf '=%.0s' {1..78})"
                cat "$f"
              done
            done < notices/modules.txt
          } > "$out"
          # Every linked module must have contributed a license.
          while read -r mod dir; do grep -qF "$mod (" "$out" || { echo "::error::No license found for $mod"; exit 1; }; done < notices/modules.txt
          echo "$(wc -l < notices/modules.txt) modules"

      - name: Assemble zip
        run: |
          set -euo pipefail
          root=stage
          mkdir -p "$root/App/Grout/grout"
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{RELEASE}}/$RELEASE/g" .github/profiles/README.txt > "$root/README.txt"
          install -m 644 LICENSE "$root/App/Grout/LICENSE"
          install -m 644 notices/THIRD-PARTY-NOTICES.txt "$root/App/Grout/THIRD-PARTY-NOTICES.txt"
          install -m 755 bin/grout-arm64 "$root/App/Grout/grout/grout64"
          install -m 755 bin/grout-arm32 "$root/App/Grout/grout/grout32"
          mkdir -p dist
          ZIP="grout-mosaic-patch-$RELEASE.zip"
          (cd "$root" && zip -X -r "../dist/$ZIP" README.txt App)
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256")
          unzip -Z dist/"$ZIP"
          cat "dist/$ZIP.sha256"

      - name: Generate patch
        run: |
          set -euo pipefail
          # Patch commits only (upstream tag..HEAD), without CI files.
          BASE=$(jq -r .version pak.json)
          # The fork carries no upstream tags; take the release tag from upstream.
          git rev-parse --verify -q "refs/tags/$BASE" >/dev/null ||
            git fetch --no-tags https://github.com/rommapp/grout.git "refs/tags/$BASE:refs/tags/$BASE"
          git format-patch --stdout "$BASE"..HEAD -- . ':!.github' > "dist/grout-mosaic-patch-$RELEASE.patch"
          test -s "dist/grout-mosaic-patch-$RELEASE.patch"

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grout-mosaic-patch-${{ needs.version.outputs.release }}
          path: dist/*
          if-no-files-found: warn

      - name: Publish release
        # Tag pushes are never dry runs.
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          ZIP="grout-mosaic-patch-$RELEASE.zip"
          files=("dist/$ZIP" "dist/$ZIP.sha256" "dist/grout-mosaic-patch-$RELEASE.patch")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            SHA256=$(cut -d' ' -f1 "dist/$ZIP.sha256")
            BRANCH=$(git branch -r --contains HEAD --format='%(refname:lstrip=3)' \
              | grep -vE '^(main|HEAD)$' | head -n1 || true)
            BRANCH=${BRANCH:-per-device-save-profiles}
            sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{RELEASE}}|$RELEASE|g" -e "s|{{SHA256}}|$SHA256|g" \
                -e "s|{{BRANCH}}|$BRANCH|g" .github/profiles/release-notes.md > notes.md
            gh release create "$TAG" "${files[@]}" --prerelease \
              --title "grout-mosaic-patch-$RELEASE" \
              --notes-file notes.md
          fi
